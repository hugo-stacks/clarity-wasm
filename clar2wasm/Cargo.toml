[package]
name = "clar2wasm"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
clap = { version = "4.3.17", features = ["derive"], optional = true }
regex = { version = "1.9.1", optional = true }
walrus = { version = "0.20.1", default-features = false }
lazy_static = "1.4.0"
wasmi = { version = "2.0.0", features = ["simd"], optional = true }
sha2 = { version = "0.10.7", optional = true }
chrono = { version = "0.4.20", optional = true }
rusqlite = { version = "0.31.0", optional = true }

clarity = { git = "https://github.com/melcar-stacks/stacks-core", branch = "wasmi", default-features = false }
stacks-common = { git = "https://github.com/melcar-stacks/stacks-core", branch = "wasmi", default-features = false }
clarity-types = { git = "https://github.com/melcar-stacks/stacks-core", branch = "wasmi", default-features = false }

[build-dependencies]
wat = "1.0.74"

[features]
default = ["runtime"]
runtime = [
  "dep:clap",
  "dep:regex",
  "dep:wasmi",
  "dep:sha2",
  "dep:chrono",
  "dep:rusqlite",
  "clarity/default",
  "stacks-common/default",
  "clarity-types/default",
]
flamegraph = []
pb = []

# Test-specific features

# Clarity version to test - default v2
test-clarity-v1 = []
test-clarity-v2 = []
test-clarity-v3 = []
test-clarity-v4 = []
test-clarity-v5 = []
test-clarity-v6 = []
developer-mode = []

[dev-dependencies]
clar2wasm = { path = ".", features = ["developer-mode"] }
criterion = "0.5"
proptest = "1.2.0"
num-integer = { version = "0.1.45", default-features = false }
hex = "0.4.3"
pprof = { version = "0.14", features = [
  "flamegraph",
  "protobuf-codec",
  "criterion",
  "frame-pointer",
] }
assert_fs = "1.1.1"
assert_cmd = "2.0.14"
wasmparser = "0.207.0"
predicates = "3.1.0"
paste = "1"

[lib]
path = "src/lib.rs"

[[bin]]
name = "clar2wasm"
path = "src/bin/main.rs"
required-features = ["runtime"]

[[bin]]
name = "crosscheck"
path = "src/bin/crosscheck.rs"
required-features = ["runtime"]

[[bench]]
name = "comparison"
harness = false
required-features = ["runtime"]

[lints.clippy]
result_large_err = "allow"
